name: LinxGo CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create project scaffold
        run: |
          flutter create -t app --org com.linxgo --project-name linxgo scaffold
          rm -rf scaffold/lib scaffold/test
          cp -r lib scaffold/lib
          cp -r assets scaffold/assets 2>/dev/null || true
          cp pubspec.yaml scaffold/
          cp analysis_options.yaml scaffold/ 2>/dev/null || true
      - name: Get dependencies
        working-directory: scaffold
        run: flutter pub get
      - name: Build APK
        working-directory: scaffold
        run: flutter build apk --release
      - name: List APK
        run: ls -la scaffold/build/app/outputs/flutter-apk/ 2>/dev/null || find . -name "*.apk" 2>/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: LinxGo
          path: scaffold/build/app/outputs/flutter-apk/app-release.apk
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: LinxGo v${{ github.run_number }}
          files: scaffold/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
