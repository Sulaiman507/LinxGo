name: LinxGo CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create project scaffold
        run: |
          flutter create -t app --org com.linxgo --project-name linxgo scaffold
          rm -rf scaffold/lib scaffold/test
          cp -r lib scaffold/lib
          cp -r assets scaffold/assets 2>/dev/null || true
          cp pubspec.yaml analysis_options.yaml scaffold/
      - name: Patch Android manifest for cleartext traffic
        run: |
          # Create network security config
          mkdir -p scaffold/android/app/src/main/res/xml
          cat > scaffold/android/app/src/main/res/xml/network_security_config.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true">
                  <trust-anchors>
                      <certificates src="system" />
                  </trust-anchors>
              </base-config>
          </network-security-config>
          EOF
          
          # Patch AndroidManifest.xml
          sed -i 's|android:usesCleartextTraffic="true"|android:usesCleartextTraffic="true"\n        android:networkSecurityConfig="@xml/network_security_config"|' scaffold/android/app/src/main/AndroidManifest.xml
          
          echo "✅ Android manifest patched"
          cat scaffold/android/app/src/main/AndroidManifest.xml | head -20
      - name: Get dependencies
        working-directory: scaffold
        run: flutter pub get
      - name: Build APK
        working-directory: scaffold
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LinxGo
          path: scaffold/build/app/outputs/flutter-apk/app-release.apk
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: LinxGo v${{ github.run_number }}
          files: scaffold/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
