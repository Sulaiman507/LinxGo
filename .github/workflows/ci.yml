name: LinxGo CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Scaffold and copy source
        run: |
          flutter create -t app --org com.linxgo --project-name linxgo scaffold
          rm -rf scaffold/lib scaffold/test
          cp -r lib scaffold/lib
          cp pubspec.yaml analysis_options.yaml scaffold/
      - name: Get dependencies
        working-directory: scaffold
        run: flutter pub get
      - name: Build APK
        working-directory: scaffold
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LinxGo
          path: scaffold/build/app/outputs/flutter-apk/app-release.apk
      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: LinxGo Build ${{ github.run_number }}
          files: scaffold/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
