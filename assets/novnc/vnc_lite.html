<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VNC</title>
<style>
body { margin:0; padding:0; background:#0a0a1a; overflow:hidden; font-family:sans-serif; }
#status { position:fixed; top:0; left:0; right:0; bottom:0; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#e94560; z-index:100; }
#status .icon { font-size:48px; margin-bottom:16px; }
#status .text { font-size:14px; color:#9ca3af; }
</style>
</head>
<body>
<div id="status"><div class="icon">🖥️</div><div class="text" id="t">Connecting...</div></div>
<canvas id="c" style="display:none;"></canvas>
<script>
var status=document.getElementById('t');
try {
  var ws = new WebSocket('ws://127.0.0.1:6080/');
  ws.onopen = function() {
    status.textContent='Connected! Waiting for desktop...';
    document.getElementById('status').style.display='none';
    document.getElementById('c').style.display='block';
  };
  ws.onerror = function(e) { status.textContent='WebSocket error'; };
  ws.onclose = function(e) { status.textContent='Disconnected: '+(e.reason||'Unknown'); };
  ws.onmessage = function(e) {
    // Handle VNC messages here
    console.log('VNC data received:', e.data.byteLength||e.data.length);
  };
} catch(e) {
  status.textContent='Error: '+e.message;
}
</script>
</body>
</html>
