<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Linux Desktop</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a1a; overflow: hidden; font-family: sans-serif; touch-action: none; }
    #screen { width: 100vw; height: 100vh; }
    #status {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      color: #e94560; text-align: center;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 100; background: #0a0a1a;
    }
    #status .icon { font-size: 48px; margin-bottom: 16px; }
    #status .text { font-size: 14px; color: #9ca3af; }
  </style>
</head>
<body>
  <div id="status">
    <div class="icon">🖥️</div>
    <div class="text" id="statusText">Connecting...</div>
  </div>
  <div id="screen"></div>
  <script type="module">
    // Use noVNC from the local websockify server
    import RFB from './vendor/novnc/core/rfb.js';
    
    const statusEl = document.getElementById('status');
    const statusText = document.getElementById('statusText');
    const screenEl = document.getElementById('screen');
    
    const wsUrl = 'ws://127.0.0.1:6080/';
    statusText.textContent = 'Connecting to ' + wsUrl + '...';
    
    try {
      const rfb = new RFB(screenEl, wsUrl, {
        shared: true,
        credentials: { password: 'password' }
      });
      
      rfb.addEventListener("connect", () => {
        statusEl.style.display = 'none';
      });
      
      rfb.addEventListener("disconnect", (detail) => {
        statusEl.style.display = 'flex';
        statusText.textContent = 'Disconnected: ' + (detail.detail.reason || 'Unknown');
      });
      
      rfb.addEventListener("credentialsrequired", () => {
        rfb.sendCredentials({ password: 'password' });
      });
      
      rfb.scaleViewport = true;
      rfb.resizeSession = true;
    } catch (e) {
      statusEl.style.display = 'flex';
      statusText.textContent = 'Error: ' + e.message;
    }
  </script>
</body>
</html>
